<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запас топлива</title>
</head>
<body>
    <nav>
        <a href="{% url 'index' %}">Главная</a> |
        <a href="{% url 'fuel' %}">Запас топлива</a>
    </nav>
    <h1>Запас топлива</h1>
    <p>Расстояние: {{ distance }}</p>
    <p>Расход на 1 км: {{ consumption }}</p>
    <p>Нужно топлива: {{ needed_fuel }}</p>
    {% if needed_fuel <= 100 %}
        <div class="success">Запаса топлива достаточно!
        Можно лететь.</div>
    {% else %}
        <div class="error">Запаса топлива не хватает!
        Нужно {{ needed_fuel }}, а есть только 100.</div>
    {% endif %}
</body>
</html>
